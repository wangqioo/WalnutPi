<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walnut Agent Console</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #0b0d0f;
        color: #ebe7d8;
        --muted: #8d958f;
        --line: rgba(235, 231, 216, 0.13);
        --cyan: #78c8c1;
        --green: #75c486;
        --red: #d66b65;
        --gold: #d0a044;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #101112;
      }

      body {
        padding: 18px;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .shell {
        display: grid;
        width: min(100%, 960px);
        gap: 14px;
        margin: 0 auto;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
      }

      h1 {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 11px;
        color: var(--muted);
        font-size: 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--gold);
      }

      .status.is-ready .dot {
        background: var(--green);
      }

      .status.is-error .dot {
        background: var(--red);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 480px) minmax(280px, 420px);
        gap: 18px;
        align-items: start;
      }

      .screen {
        display: grid;
        width: min(100%, 480px);
        aspect-ratio: 3 / 2;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(235, 231, 216, 0.22);
        border-radius: 0;
        background: #030506;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.65), 0 18px 48px rgba(0, 0, 0, 0.32);
      }

      .screen img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .empty {
        color: var(--muted);
        font-size: 13px;
      }

      .panel {
        display: grid;
        gap: 14px;
        min-width: 0;
        padding-top: 2px;
      }

      .processor {
        display: grid;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .processor-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .summary {
        min-height: 36px;
        border: 1px solid rgba(241, 239, 231, 0.1);
        padding: 9px 10px;
        color: #d8e7dc;
        font-size: 12px;
        line-height: 1.45;
      }

      .field {
        display: grid;
        gap: 5px;
        min-width: 0;
      }

      .field.is-wide {
        grid-column: 1 / -1;
      }

      .field span {
        color: var(--muted);
        font-size: 11px;
      }

      .field input,
      .field select {
        width: 100%;
        min-width: 0;
        height: 32px;
        border: 1px solid rgba(241, 239, 231, 0.13);
        border-radius: 0;
        padding: 0 9px;
        background: rgba(0, 0, 0, 0.24);
        color: #f1efe7;
        font-size: 12px;
        letter-spacing: 0;
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(120, 200, 193, 0.62);
        outline: none;
      }

      .meta {
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .row strong,
      .row code {
        overflow: hidden;
        color: #e5e0cf;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .button {
        min-height: 34px;
        border: 1px solid rgba(120, 200, 193, 0.28);
        border-radius: 0;
        padding: 0 12px;
        background: rgba(120, 200, 193, 0.12);
        color: #d8fffb;
        font-size: 12px;
        font-weight: 730;
      }

      .button:hover,
      .button:focus-visible {
        background: rgba(120, 200, 193, 0.24);
        outline: none;
      }

      .button:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      .items {
        display: grid;
        gap: 6px;
      }

      .lvgl-preview {
        display: none;
      }

      .lvgl-preview.is-visible {
        display: none;
      }

      .lvgl-preview-grid {
        display: grid;
        gap: 8px;
      }

      .lvgl-stage {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(241, 239, 231, 0.14);
        background: #000;
      }

      .lvgl-stage img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .lvgl-stage-label {
        display: none;
      }

      .lvgl-nav {
        display: none;
      }

      .lvgl-nav:hover,
      .lvgl-nav:focus-visible {
        background: rgba(120, 200, 193, 0.24);
        outline: none;
      }

      .lvgl-nav.is-prev {
        left: 8px;
      }

      .lvgl-nav.is-next {
        right: 8px;
      }

      .lvgl-strip {
        display: none;
      }

      .lvgl-thumb {
        flex: 0 0 88px;
        border: 1px solid rgba(241, 239, 231, 0.12);
        padding: 0;
        background: #000;
        scroll-snap-align: center;
      }

      .lvgl-thumb.is-active {
        border-color: rgba(120, 200, 193, 0.72);
      }

      .lvgl-thumb img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        image-rendering: pixelated;
      }

      .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        border: 1px solid rgba(241, 239, 231, 0.11);
        border-radius: 0;
        padding: 8px;
        background: transparent;
        color: var(--muted);
        text-align: left;
      }

      .item.is-active {
        border-color: rgba(120, 200, 193, 0.54);
        color: #f1efe7;
      }

      .item span,
      .item code {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      details {
        border-top: 1px solid rgba(241, 239, 231, 0.1);
        padding-top: 10px;
      }

      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }

      pre {
        max-height: 260px;
        overflow: auto;
        border-radius: 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.28);
        color: #d8e7dc;
        font: 11px/1.45 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        white-space: pre-wrap;
      }

      @media (max-width: 760px) {
        body {
          padding: 12px;
        }

        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="top">
        <h1>Walnut Agent Console / Screen Workspace</h1>
        <div id="status" class="status"><span class="dot"></span><span>未同步</span></div>
      </div>
      <section class="workspace">
        <div class="screen">
          <img id="screenImage" alt="Screen Workspace preview" hidden />
          <div id="empty" class="empty">等待 Screen Playlist</div>
        </div>
        <aside class="panel">
          <div class="meta">
            <div class="row"><span>playlist</span><strong id="playlistId">-</strong></div>
            <div class="row"><span>frames</span><strong id="playlistItems">-</strong></div>
            <div class="row"><span>current</span><strong id="itemLabel">-</strong></div>
            <div class="row"><span>output</span><strong id="outputLabel">-</strong></div>
          </div>
          <div class="controls">
            <button id="reload" class="button" type="button">重新读取</button>
            <button id="toggle" class="button" type="button">暂停预览</button>
            <button id="lvglPreview" class="button" type="button">刷新预览</button>
            <button id="sync" class="button" type="button">同步到核桃派</button>
          </div>
          <form id="processor" class="processor">
            <div class="processor-grid">
              <label class="field is-wide">
                <span>素材</span>
                <select id="sourceChoice" name="sourceChoice">
                  <option value="default-source">默认像素素材</option>
                  <option value="url">导入素材直链</option>
                  <option value="custom">使用项目内文件</option>
                </select>
              </label>
              <label id="sourceUrlField" class="field is-wide" hidden>
                <span>图片/GIF/视频直链</span>
                <input id="sourceUrl" name="sourceUrl" autocomplete="off" placeholder="https://example.com/pixel-loop.gif" />
              </label>
              <label id="sourcePathField" class="field is-wide" hidden>
                <span>项目内文件路径</span>
                <input id="sourcePath" name="sourcePath" autocomplete="off" placeholder="screen/sources/default-source/original.png" />
              </label>
              <label class="field">
                <span>处理方式</span>
                <select id="preset" name="preset">
                  <option value="fit-cover:480x320">铺满屏幕</option>
                  <option value="fit-contain:480x320">完整显示</option>
                  <option value="pixel-grid:120x80@4x">低清像素化</option>
                  <option value="pixel-grid:240x160@2x">高清像素化</option>
                </select>
              </label>
              <label class="field">
                <span>播放列表</span>
                <select id="playlistMode" name="playlistMode">
                  <option value="replace">替换当前播放列表</option>
                  <option value="append">追加到播放列表</option>
                  <option value="none">只生成不加入</option>
                </select>
              </label>
            </div>
            <details>
              <summary>高级处理</summary>
              <div class="processor-grid">
                <label class="field">
                  <span>输出 ID</span>
                  <input id="screenId" name="screenId" autocomplete="off" value="workspace-output" />
                </label>
                <label class="field">
                  <span>输出类型</span>
                  <select id="outputType" name="outputType">
                    <option value="static">静态图片</option>
                    <option value="animated">动画</option>
                  </select>
                </label>
                <label class="field">
                  <span>fps</span>
                  <input id="fps" name="fps" inputmode="numeric" value="6" />
                </label>
                <label class="field">
                  <span>秒数</span>
                  <input id="maxSeconds" name="maxSeconds" inputmode="numeric" value="8" />
                </label>
                <label class="field">
                  <span>最大帧数</span>
                  <input id="maxFrames" name="maxFrames" inputmode="numeric" value="24" />
                </label>
              </div>
            </details>
            <button id="processButton" class="button" type="submit">生成 480x320 屏幕输出</button>
          </form>
          <div id="summary" class="summary">准备预览当前播放列表。</div>
          <section id="lvglPreviewPanel" class="lvgl-preview" aria-live="polite">
            <div class="row"><span>LVGL</span><strong id="lvglPreviewLabel">-</strong></div>
            <div id="lvglPreviewFrames" class="lvgl-preview-grid">
              <div class="lvgl-stage">
                <img id="lvglStageImage" alt="LVGL preview frame" />
                <button id="lvglPrev" class="lvgl-nav is-prev" type="button" aria-label="Previous LVGL frame">‹</button>
                <button id="lvglNext" class="lvgl-nav is-next" type="button" aria-label="Next LVGL frame">›</button>
                <span id="lvglStageLabel" class="lvgl-stage-label">-</span>
              </div>
              <div id="lvglStrip" class="lvgl-strip"></div>
            </div>
          </section>
          <div id="items" class="items"></div>
          <details>
            <summary>diagnostics</summary>
            <pre id="diagnostics">等待数据。</pre>
          </details>
        </aside>
      </section>
    </main>
    <script>
      const statusEl = document.querySelector("#status");
      const statusText = statusEl.querySelector("span:last-child");
      const screenImage = document.querySelector("#screenImage");
      const empty = document.querySelector("#empty");
      const playlistId = document.querySelector("#playlistId");
      const playlistItems = document.querySelector("#playlistItems");
      const itemLabel = document.querySelector("#itemLabel");
      const outputLabel = document.querySelector("#outputLabel");
      const diagnostics = document.querySelector("#diagnostics");
      const itemsEl = document.querySelector("#items");
      const reloadButton = document.querySelector("#reload");
      const toggleButton = document.querySelector("#toggle");
      const lvglPreviewButton = document.querySelector("#lvglPreview");
      const syncButton = document.querySelector("#sync");
      const processor = document.querySelector("#processor");
      const processButton = document.querySelector("#processButton");
      const sourceChoiceInput = document.querySelector("#sourceChoice");
      const sourceUrlField = document.querySelector("#sourceUrlField");
      const sourceUrlInput = document.querySelector("#sourceUrl");
      const sourcePathField = document.querySelector("#sourcePathField");
      const sourcePathInput = document.querySelector("#sourcePath");
      const screenIdInput = document.querySelector("#screenId");
      const outputTypeInput = document.querySelector("#outputType");
      const presetInput = document.querySelector("#preset");
      const playlistModeInput = document.querySelector("#playlistMode");
      const fpsInput = document.querySelector("#fps");
      const maxSecondsInput = document.querySelector("#maxSeconds");
      const maxFramesInput = document.querySelector("#maxFrames");
      const summary = document.querySelector("#summary");
      const lvglPreviewPanel = document.querySelector("#lvglPreviewPanel");
      const lvglPreviewLabel = document.querySelector("#lvglPreviewLabel");
      const lvglStageImage = document.querySelector("#lvglStageImage");
      const lvglStageLabel = document.querySelector("#lvglStageLabel");
      const lvglPrevButton = document.querySelector("#lvglPrev");
      const lvglNextButton = document.querySelector("#lvglNext");
      const lvglStrip = document.querySelector("#lvglStrip");

      let envelope = null;
      let activeItemIndex = 0;
      let activeFrameIndex = 0;
      let activeRepeat = 0;
      let timer = 0;
      let paused = false;
      let lvglFrames = [];
      let activeLvglFrame = 0;

      function setStatus(text, kind = "") {
        statusText.textContent = text;
        statusEl.classList.toggle("is-ready", kind === "ready");
        statusEl.classList.toggle("is-error", kind === "error");
      }

      function clearTimer() {
        if (timer) window.clearTimeout(timer);
        timer = 0;
      }

      function numericValue(input, defaultValue) {
        const value = Number(input.value);
        return Number.isFinite(value) ? value : defaultValue;
      }

      async function loadPlaylist() {
        clearTimer();
        setStatus("同步中");
        try {
          const response = await fetch("/api/screen/workspace/playlist", { cache: "no-store" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "playlist load failed");
          envelope = data;
          activeItemIndex = 0;
          activeFrameIndex = 0;
          activeRepeat = 0;
          renderEnvelope();
          setStatus("未同步");
          const hasWidgetApp = envelope.items.some((item) => item.hasWidgetApp || item.hasRuntimeWidgets);
          if (hasWidgetApp) {
            await loadLvglPreview();
          }
          if (!paused && !hasWidgetApp) scheduleNext(0);
        } catch (error) {
          envelope = null;
          screenImage.hidden = true;
          empty.hidden = false;
          diagnostics.textContent = error.message;
          summary.textContent = "播放列表读取失败。";
          setStatus("同步失败", "error");
        }
      }

      function renderEnvelope() {
        playlistId.textContent = envelope.playlist.id;
        playlistItems.textContent = `${envelope.items.length}`;
        diagnostics.textContent = JSON.stringify(envelope, null, 2);
        summary.textContent = `当前播放列表有 ${envelope.items.length} 个输出，可以预览或同步到核桃派。`;
        itemsEl.replaceChildren(...envelope.items.map((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "item";
          button.innerHTML = `<span>${item.manifestId}</span><code>${item.output.type}</code>`;
          button.addEventListener("click", () => {
            activeItemIndex = index;
            activeFrameIndex = 0;
            activeRepeat = 0;
            clearTimer();
            renderCurrent();
            if (!paused) scheduleNext(currentDelay());
          });
          return button;
        }));
        renderCurrent();
      }

      function currentItem() {
        return envelope?.items?.[activeItemIndex] || null;
      }

      function currentFrame(item) {
        if (!item) return null;
        if (item.output.type === "static") return item.output;
        return item.output.frames[activeFrameIndex % item.output.frames.length];
      }

      function renderCurrent() {
        const item = currentItem();
        const frame = currentFrame(item);
        for (const [index, node] of [...itemsEl.children].entries()) {
          node.classList.toggle("is-active", index === activeItemIndex);
        }
        if (!item || !frame) return;
        if (item.hasWidgetApp || item.hasRuntimeWidgets) {
          if (lvglFrames.length) {
            renderLvglCarousel(activeLvglFrame);
          } else {
            screenImage.hidden = true;
            empty.hidden = false;
            empty.textContent = "LVGL Widget Preview";
          }
          itemLabel.textContent = `${activeItemIndex + 1}/${envelope.items.length} ${item.manifestId}`;
          outputLabel.textContent = item.hasWidgetApp ? "widget app" : "lvgl widgets";
          return;
        }
        empty.hidden = true;
        screenImage.hidden = false;
        screenImage.src = `${frame.url}?v=${encodeURIComponent(item.manifestHash)}`;
        itemLabel.textContent = `${activeItemIndex + 1}/${envelope.items.length} ${item.manifestId}`;
        outputLabel.textContent = item.output.type === "static"
          ? "static 480x320"
          : `frame ${activeFrameIndex + 1}/${item.output.frames.length}`;
      }

      function currentDelay() {
        const item = currentItem();
        if (!item) return 1000;
        if (item.output.type === "static") return item.durationMs;
        return currentFrame(item)?.durationMs || 100;
      }

      function advance() {
        const item = currentItem();
        if (!item || paused) return;
        if (item.output.type === "animated" && activeFrameIndex < item.output.frames.length - 1) {
          activeFrameIndex += 1;
        } else {
          activeFrameIndex = 0;
          if (activeRepeat < item.repeat - 1) {
            activeRepeat += 1;
          } else {
            activeRepeat = 0;
            activeItemIndex += 1;
            if (activeItemIndex >= envelope.items.length) {
              activeItemIndex = envelope.playlist.loop ? 0 : envelope.items.length - 1;
            }
          }
        }
        renderCurrent();
        scheduleNext(currentDelay());
      }

      function scheduleNext(delay) {
        clearTimer();
        if (paused || !envelope) return;
        timer = window.setTimeout(advance, Math.max(1, delay));
      }

      function renderLvglCarousel(index = activeLvglFrame) {
        if (!lvglFrames.length) return;
        activeLvglFrame = (index + lvglFrames.length) % lvglFrames.length;
        const frame = lvglFrames[activeLvglFrame];
        lvglStageImage.src = `${frame.png}?v=${encodeURIComponent(frame.playlistHash)}`;
        if (currentItem()?.hasWidgetApp || currentItem()?.hasRuntimeWidgets) {
          empty.hidden = true;
          screenImage.hidden = false;
          screenImage.src = lvglStageImage.src;
        }
        lvglStageLabel.textContent = "LVGL";
        for (const [thumbIndex, node] of [...lvglStrip.children].entries()) {
          node.classList.toggle("is-active", thumbIndex === activeLvglFrame);
          if (thumbIndex === activeLvglFrame) {
            node.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          }
        }
      }

      function setLvglFrames(result) {
        lvglFrames = result.frames.map((frame) => ({
          ...frame,
          playlistHash: result.playlistHash,
        }));
        activeLvglFrame = 0;
        lvglStrip.replaceChildren(...lvglFrames.map((frame, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "lvgl-thumb";
          button.setAttribute("aria-label", `LVGL frame ${index + 1}`);
          const img = document.createElement("img");
          img.src = `${frame.png}?v=${encodeURIComponent(result.playlistHash)}`;
          img.alt = "";
          button.append(img);
          button.addEventListener("click", () => renderLvglCarousel(index));
          return button;
        }));
        renderLvglCarousel(0);
      }

      reloadButton.addEventListener("click", loadPlaylist);
      toggleButton.addEventListener("click", () => {
        paused = !paused;
        toggleButton.textContent = paused ? "播放" : "暂停";
        if (paused) clearTimer();
        else scheduleNext(0);
      });
      async function loadLvglPreview() {
        lvglPreviewButton.disabled = true;
        setStatus("同步中");
        summary.textContent = "正在构建 LVGL 离屏预览。";
        try {
          const response = await fetch("/api/screen/workspace/lvgl-preview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.output || result.error || "LVGL preview failed");
          diagnostics.textContent = JSON.stringify(result, null, 2);
          lvglPreviewPanel.classList.add("is-visible");
          lvglPreviewLabel.textContent = "预览已就绪";
          setLvglFrames(result);
          summary.textContent = "已生成 LVGL 离屏渲染预览。";
          setStatus("未同步");
        } catch (error) {
          setStatus("同步失败", "error");
          diagnostics.textContent = error.message;
          summary.textContent = "LVGL 预览生成失败，请查看诊断。";
        } finally {
          lvglPreviewButton.disabled = false;
        }
      }

      lvglPreviewButton.addEventListener("click", loadLvglPreview);
      lvglPrevButton.addEventListener("click", () => renderLvglCarousel(activeLvglFrame - 1));
      lvglNextButton.addEventListener("click", () => renderLvglCarousel(activeLvglFrame + 1));
      lvglPreviewPanel.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") renderLvglCarousel(activeLvglFrame - 1);
        if (event.key === "ArrowRight") renderLvglCarousel(activeLvglFrame + 1);
      });
      syncButton.addEventListener("click", async () => {
        syncButton.disabled = true;
        setStatus("同步中");
        try {
          const playlistResponse = await fetch("/api/screen/workspace/playlist", { cache: "no-store" });
          const latestEnvelope = await playlistResponse.json();
          if (!playlistResponse.ok || !latestEnvelope?.playlistHash) {
            throw new Error(latestEnvelope.error || "playlistHash is missing; refresh or generate a playlist first");
          }
          envelope = latestEnvelope;
          activeItemIndex = 0;
          activeFrameIndex = 0;
          activeRepeat = 0;
          renderEnvelope();
          const response = await fetch("/api/screen/workspace/sync", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ playlistHash: latestEnvelope.playlistHash }),
          });
          const result = await response.json();
          diagnostics.textContent = JSON.stringify(result, null, 2);
          summary.textContent = result.summary || (result.ok ? "已同步到核桃派。" : "同步失败，请查看诊断。");
          setStatus(result.ok ? "已同步到核桃派" : "同步失败", result.ok ? "ready" : "error");
        } catch (error) {
          setStatus("同步失败", "error");
          diagnostics.textContent = error.message;
          summary.textContent = "同步失败，请查看诊断。";
        } finally {
          syncButton.disabled = false;
        }
      });
      sourceChoiceInput.addEventListener("change", () => {
        sourceUrlField.hidden = sourceChoiceInput.value !== "url";
        sourcePathField.hidden = sourceChoiceInput.value !== "custom";
      });
      sourceChoiceInput.dispatchEvent(new Event("change"));
      outputTypeInput.addEventListener("change", () => {
        const animated = outputTypeInput.value === "animated";
        fpsInput.disabled = !animated;
        maxSecondsInput.disabled = !animated;
        maxFramesInput.disabled = !animated;
      });
      outputTypeInput.dispatchEvent(new Event("change"));
      processor.addEventListener("submit", async (event) => {
        event.preventDefault();
        const urlSource = sourceChoiceInput.value === "url";
        const customSource = sourceChoiceInput.value === "custom";
        const sourceUrl = sourceUrlInput.value.trim();
        const sourcePath = sourcePathInput.value.trim();
        const screenId = screenIdInput.value.trim();
        if ((urlSource && !sourceUrl) || (customSource && !sourcePath) || !screenId) {
          setStatus("同步失败", "error");
          diagnostics.textContent = "source file and screen id are required";
          summary.textContent = "请选择素材后再生成输出。";
          return;
        }

        processButton.disabled = true;
        setStatus("同步中");
        try {
          let sourcePayload = { sourceAssetId: sourceChoiceInput.value };
          if (urlSource) {
            summary.textContent = "正在导入素材直链。";
            const importResponse = await fetch("/api/screen/workspace/import", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                sourceId: `${screenId}-source`,
                url: sourceUrl,
                license: "unknown-personal-sync",
              }),
            });
            const importResult = await importResponse.json();
            if (!importResponse.ok) throw new Error(importResult.output || importResult.error || "import failed");
            sourcePayload = { sourceAssetId: importResult.sourceAssetId };
          } else if (customSource) {
            sourcePayload = { sourcePath };
          }

          const response = await fetch("/api/screen/workspace/process", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ...sourcePayload,
              screenId,
              outputType: outputTypeInput.value,
              preset: presetInput.value,
              playlist: playlistModeInput.value === "none" ? false : "default",
              playlistMode: playlistModeInput.value === "append" ? "append" : "replace",
              animation: {
                fps: numericValue(fpsInput, 6),
                maxSeconds: numericValue(maxSecondsInput, 8),
                maxFrames: numericValue(maxFramesInput, 24),
              },
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.output || result.error || "processing failed");
          diagnostics.textContent = JSON.stringify(result, null, 2);
          summary.textContent = "已生成屏幕输出，并更新播放列表预览。";
          await loadPlaylist();
        } catch (error) {
          setStatus("同步失败", "error");
          diagnostics.textContent = error.message;
          summary.textContent = "生成失败，请查看诊断。";
        } finally {
          processButton.disabled = false;
        }
      });

      loadPlaylist();
    </script>
  </body>
</html>
