<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walnut Agent Console</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #101112;
        color: #efece2;
        --muted: #949c97;
        --line: rgba(239, 236, 226, 0.14);
        --panel: #17191a;
        --green: #78c58a;
        --cyan: #7ccbc5;
        --red: #d86d67;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101112;
      }

      button,
      textarea {
        font: inherit;
        color: inherit;
      }

      button:disabled,
      textarea:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 1px;
        height: 100vh;
        overflow: hidden;
        background: var(--line);
      }

      .pane {
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        align-content: stretch;
        gap: 18px;
        min-height: 0;
        overflow: hidden;
        padding: 22px;
        background: #101112;
      }

      .side {
        grid-template-rows: auto auto;
        align-content: start;
        background: #141617;
        overflow-y: auto;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: clamp(24px, 4vw, 48px);
        line-height: 1;
        font-weight: 650;
      }

      h2 {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .composer {
        display: grid;
        gap: 10px;
        max-width: 860px;
        min-height: 0;
      }

      textarea {
        width: 100%;
        height: 136px;
        min-height: 96px;
        max-height: 180px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 14px;
        background: var(--panel);
        color: #f5f2e8;
        outline: none;
        line-height: 1.5;
      }

      textarea:focus {
        border-color: rgba(124, 203, 197, 0.72);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 0 16px;
        background: #1b1e1f;
        cursor: pointer;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }

      .button.primary {
        border-color: rgba(124, 203, 197, 0.54);
        background: rgba(124, 203, 197, 0.12);
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(239, 236, 226, 0.34);
        outline: none;
      }

      .result {
        display: grid;
        align-content: start;
        gap: 10px;
        min-height: 0;
        height: 100%;
        overflow: auto;
        border: 1px solid var(--line);
        padding: 14px;
        background: #121415;
        line-height: 1.5;
      }

      .message {
        display: grid;
        gap: 6px;
        max-width: 92%;
      }

      .message.user {
        justify-self: end;
      }

      .message.assistant,
      .message.system {
        justify-self: start;
      }

      .message-role {
        color: var(--muted);
        font-size: 11px;
      }

      .message-body {
        border: 1px solid rgba(239, 236, 226, 0.12);
        padding: 10px 12px;
        background: #17191a;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .message.user .message-body {
        border-color: rgba(124, 203, 197, 0.28);
        background: rgba(124, 203, 197, 0.1);
      }

      .label {
        color: var(--muted);
        font-size: 12px;
      }

      .stack {
        display: grid;
        gap: 10px;
        min-height: 0;
      }

      .pane:not(.side) > .stack:last-child {
        grid-template-rows: auto minmax(0, 1fr);
      }

      .metric {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        border-bottom: 1px solid rgba(239, 236, 226, 0.1);
        padding: 9px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        color: #f3f0e7;
        font-weight: 600;
      }

      .quick {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .quick .button {
        width: 100%;
      }

      .preview {
        display: grid;
        place-items: center;
        aspect-ratio: 3 / 2;
        min-height: 180px;
        border: 1px solid var(--line);
        background: #050606;
        color: var(--muted);
        line-height: 1;
        text-align: center;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: var(--green);
      }

      @media (max-width: 860px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
        }

        .side {
          max-height: 34vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="pane">
        <div class="topline">
          <span>WalnutPi</span>
          <span class="status"><span class="dot"></span><span>Agent Console</span></span>
        </div>
        <h1>Walnut Agent Console</h1>
        <form id="composer" class="composer">
          <textarea id="prompt" autocomplete="off" placeholder="例如：核桃派现在还好吗 / 把上海天气做成小屏 / 记一下今天调好了 Wi-Fi"></textarea>
          <div class="actions">
            <button id="submitIntent" class="button primary" type="submit">处理意图</button>
            <button id="askAi" class="button" type="button">问 WalnutAI</button>
            <a class="button" href="/workspace.html">打开 Screen Workspace</a>
          </div>
        </form>
        <section class="stack">
          <h2>当前结果</h2>
          <div id="result" class="result">等待输入。</div>
        </section>
      </section>

      <aside class="pane side">
        <section class="stack">
          <h2>Intent Route</h2>
          <div class="metric"><span>intent</span><strong id="intent">-</strong></div>
          <div class="metric"><span>delivery</span><strong id="delivery">-</strong></div>
          <div class="metric"><span>confidence</span><strong id="confidence">-</strong></div>
        </section>
        <section class="stack">
          <h2>Screen Preview</h2>
          <a class="preview" href="/workspace.html">Screen Workspace</a>
        </section>
      </aside>
    </main>

    <script type="module">
      import { AnsiUp } from "/vendor/ansi_up.js";

      const promptEl = document.getElementById("prompt");
      const resultEl = document.getElementById("result");
      const intentEl = document.getElementById("intent");
      const deliveryEl = document.getElementById("delivery");
      const confidenceEl = document.getElementById("confidence");
      const submitIntentEl = document.getElementById("submitIntent");
      const askAiEl = document.getElementById("askAi");
      const ansiUp = new AnsiUp();
      const sessionId = getSessionId();

      function setResult(value) {
        resultEl.textContent = "";
        appendMessage("assistant", value || "无输出。");
      }

      function getSessionId() {
        const key = "walnut-web-session-id";
        const existing = localStorage.getItem(key);
        if (existing) return existing;
        const next = crypto.randomUUID();
        localStorage.setItem(key, next);
        return next;
      }

      function ansiToHtml(value) {
        return ansiUp.ansi_to_html(String(value || "")) || "无输出。";
      }

      function appendMessage(role, value) {
        const message = document.createElement("article");
        message.className = `message ${role}`;

        const label = document.createElement("div");
        label.className = "message-role";
        label.textContent = role === "user" ? "你" : role === "system" ? "系统" : "WalnutAI";

        const body = document.createElement("div");
        body.className = "message-body";
        body.innerHTML = ansiToHtml(value);

        message.append(label, body);
        resultEl.append(message);
        resultEl.scrollTop = resultEl.scrollHeight;
      }

      function updateRoute(classification) {
        intentEl.textContent = classification?.intent || "-";
        deliveryEl.textContent = classification?.delivery || "-";
        confidenceEl.textContent = classification?.confidence ?? "-";
      }

      async function classify(text) {
        const response = await fetch("/api/intent/classify", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || "intent classify failed");
        return data.classification;
      }

      async function runAction(action, body = {}) {
        const response = await fetch("/api/action", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action, sessionId, ...body }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.output || data.error || "action failed");
        return data;
      }

      function setBusy(busy) {
        promptEl.disabled = busy;
        submitIntentEl.disabled = busy;
        askAiEl.disabled = busy;
      }

      async function sendPrompt(mode) {
        const text = promptEl.value.trim();
        if (!text) return;
        setBusy(true);
        appendMessage("user", text);
        appendMessage("system", mode === "ai" ? "正在询问 WalnutAI..." : "处理中...");
        try {
          if (mode === "ai") {
            const data = await runAction("ai", { text });
            appendMessage("assistant", data.output);
          } else {
            const classification = await classify(text);
            updateRoute(classification);
            if (classification.intent === "device.status.read") {
              const data = await runAction("status");
              appendMessage("assistant", data.output);
            } else if (classification.intent === "device.network.read") {
              const data = await runAction("network");
              appendMessage("assistant", data.output);
            } else if (classification.intent === "device.snapshot.read") {
              const data = await runAction("snapshot");
              appendMessage("assistant", data.output);
            } else if (classification.intent === "device.gpio.read") {
              const data = await runAction("gpio");
              appendMessage("assistant", data.output);
            } else if (classification.intent === "screen.generate" || classification.intent === "screen.sync") {
              appendMessage("assistant", "已识别为小屏工作流。请进入 Screen Workspace 处理 Source Asset、Screen Output、Playlist 和 Sync。");
            } else {
              const data = await runAction("ai", { text });
              appendMessage("assistant", data.output);
            }
          }
          promptEl.value = "";
        } catch (error) {
          appendMessage("assistant", error.message);
        } finally {
          setBusy(false);
          promptEl.focus();
        }
      }

      document.getElementById("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        await sendPrompt("intent");
      });

      askAiEl.addEventListener("click", async () => {
        await sendPrompt("ai");
      });

    </script>
  </body>
</html>
