<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walnut Agent Console</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #101112;
        color: #efece2;
        --muted: #949c97;
        --line: rgba(239, 236, 226, 0.14);
        --panel: #17191a;
        --green: #78c58a;
        --cyan: #7ccbc5;
        --red: #d86d67;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101112;
      }

      button,
      textarea {
        font: inherit;
        color: inherit;
      }

      button:disabled,
      textarea:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 1px;
        height: 100vh;
        overflow: hidden;
        background: var(--line);
      }

      .pane {
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        align-content: stretch;
        gap: 18px;
        min-height: 0;
        overflow: hidden;
        padding: 22px;
        background: #101112;
      }

      .side {
        grid-template-rows: auto auto;
        align-content: start;
        background: #141617;
        overflow-y: auto;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: clamp(24px, 4vw, 48px);
        line-height: 1;
        font-weight: 650;
      }

      h2 {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .composer {
        display: grid;
        gap: 10px;
        max-width: 860px;
        min-height: 0;
      }

      textarea {
        width: 100%;
        height: 136px;
        min-height: 96px;
        max-height: 180px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 14px;
        background: var(--panel);
        color: #f5f2e8;
        outline: none;
        line-height: 1.5;
      }

      textarea:focus {
        border-color: rgba(124, 203, 197, 0.72);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 0 16px;
        background: #1b1e1f;
        cursor: pointer;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }

      .button.primary {
        border-color: rgba(124, 203, 197, 0.54);
        background: rgba(124, 203, 197, 0.12);
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(239, 236, 226, 0.34);
        outline: none;
      }

      .result {
        display: grid;
        align-content: start;
        gap: 10px;
        min-height: 0;
        height: 100%;
        overflow: auto;
        border: 1px solid var(--line);
        padding: 14px;
        background: #121415;
        line-height: 1.5;
      }

      .message {
        display: grid;
        gap: 6px;
        max-width: 92%;
      }

      .message.user {
        justify-self: end;
      }

      .message.assistant,
      .message.system {
        justify-self: start;
      }

      .message-role {
        color: var(--muted);
        font-size: 11px;
      }

      .message-body {
        border: 1px solid rgba(239, 236, 226, 0.12);
        padding: 10px 12px;
        background: #17191a;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .message.user .message-body {
        border-color: rgba(124, 203, 197, 0.28);
        background: rgba(124, 203, 197, 0.1);
      }

      .recovery-card {
        border: 1px solid rgba(216, 109, 103, 0.34);
        background: rgba(216, 109, 103, 0.08);
        padding: 12px;
        margin-top: 8px;
      }

      .recovery-card.pending {
        border-color: rgba(255, 159, 10, 0.42);
        background: rgba(255, 159, 10, 0.08);
      }

      .recovery-label {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 8px;
      }

      .recovery-error {
        color: var(--red);
        font-size: 12px;
        margin-bottom: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .recovery-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .recovery-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 0 12px;
        background: #1b1e1f;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        color: #efece2;
      }

      .recovery-btn:hover,
      .recovery-btn:focus-visible {
        border-color: rgba(239, 236, 226, 0.34);
        outline: none;
      }

      .recovery-btn.confirm {
        border-color: rgba(124, 203, 197, 0.42);
        background: rgba(124, 203, 197, 0.1);
      }

      .recovery-btn.retry {
        border-color: rgba(124, 203, 197, 0.42);
        background: rgba(124, 203, 197, 0.1);
      }

      .recovery-btn.warn {
        border-color: rgba(255, 159, 10, 0.42);
        background: rgba(255, 159, 10, 0.1);
      }

      .label {
        color: var(--muted);
        font-size: 12px;
      }

      .stack {
        position: relative;
        display: grid;
        gap: 10px;
        min-height: 0;
      }

      .pane:not(.side) > .stack:last-child {
        grid-template-rows: auto minmax(0, 1fr);
      }

      .metric {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        border-bottom: 1px solid rgba(239, 236, 226, 0.1);
        padding: 9px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        color: #f3f0e7;
        font-weight: 600;
      }

      .preview {
        display: grid;
        place-items: center;
        aspect-ratio: 3 / 2;
        min-height: 180px;
        border: 1px solid var(--line);
        background: #050606;
        color: var(--muted);
        line-height: 1;
        text-align: center;
      }

      .preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .preview.has-image {
        padding: 0;
      }

      .screen-picker {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .screen-picker select {
        min-width: 0;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 0 10px;
        background: #101112;
        color: #efece2;
        font: inherit;
        outline: none;
      }

      .screen-picker select:focus {
        border-color: rgba(124, 203, 197, 0.72);
      }

      .preview-toggle {
        min-height: 28px;
        padding: 0 9px;
        border: 1px solid rgba(239, 236, 226, 0.24);
        background: rgba(5, 6, 6, 0.72);
        color: #efece2;
        cursor: pointer;
      }

      .preview-toggle.active {
        border-color: rgba(255, 159, 10, 0.72);
        background: rgba(255, 159, 10, 0.18);
        color: #fff7df;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: var(--green);
      }

      @media (max-width: 860px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
        }

        .side {
          max-height: 34vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="pane">
        <div class="topline">
          <span>WalnutPi</span>
          <span class="status"><span class="dot"></span><span>Agent Console</span></span>
        </div>
        <h1>Walnut Agent Console</h1>
        <form id="composer" class="composer">
          <textarea id="prompt" autocomplete="off" placeholder="例如：核桃派现在还好吗 / 把上海天气做成小屏 / 记一下今天调好了 Wi-Fi"></textarea>
          <div class="actions">
            <button id="submitIntent" class="button primary" type="submit">处理意图</button>
            <button id="askAi" class="button" type="button">问 WalnutAI</button>
            <a class="button" href="/apps.html">打开 App Gallery</a>
            <a class="button" href="/workspace.html">打开 Screen Workspace</a>
          </div>
        </form>
        <section class="stack">
          <h2>当前结果</h2>
          <div id="result" class="result">等待输入。</div>
        </section>
      </section>

      <aside class="pane side">
        <section class="stack">
          <h2>Intent Route</h2>
          <div class="metric"><span>intent</span><strong id="intent">-</strong></div>
          <div class="metric"><span>delivery</span><strong id="delivery">-</strong></div>
          <div class="metric"><span>confidence</span><strong id="confidence">-</strong></div>
        </section>
        <section class="stack">
          <h2>Screen Preview</h2>
          <a id="screenPreview" class="preview has-image" href="/workspace.html">
            <span id="screenPreviewText" hidden>Screen Workspace</span>
            <img id="screenPreviewImage" alt="Screen Workspace preview" src="/api/screen/workspace/assets/outputs%2Flvgl-preview%2Flvgl-00000ms.png" />
          </a>
          <label class="screen-picker">
            <span>当前屏幕</span>
            <select id="screenAppSelect" aria-label="当前屏幕"></select>
          </label>
          <button id="screenPreviewToggle" class="preview-toggle" type="button" hidden>暂停</button>
        </section>
      </aside>
    </main>

    <script type="module">
      import { AnsiUp } from "/vendor/ansi_up.js";

      const promptEl = document.getElementById("prompt");
      const resultEl = document.getElementById("result");
      const intentEl = document.getElementById("intent");
      const deliveryEl = document.getElementById("delivery");
      const confidenceEl = document.getElementById("confidence");
      const submitIntentEl = document.getElementById("submitIntent");
      const askAiEl = document.getElementById("askAi");
      const screenPreviewEl = document.getElementById("screenPreview");
      const screenPreviewTextEl = document.getElementById("screenPreviewText");
      const screenPreviewImageEl = document.getElementById("screenPreviewImage");
      const screenPreviewToggleEl = document.getElementById("screenPreviewToggle");
      const screenAppSelectEl = document.getElementById("screenAppSelect");
      let previewFrames = [];
      let previewFrameIndex = 0;
      let previewTimer = 0;
      let previewPaused = false;
      let agentEvents = null;
      const ansiUp = new AnsiUp();
      const sessionId = getSessionId();

      function setResult(value) {
        resultEl.textContent = "";
        appendMessage("assistant", value || "无输出。");
      }

      function getSessionId() {
        const key = "walnut-web-session-id";
        const existing = localStorage.getItem(key);
        if (existing) return existing;
        const next = crypto.randomUUID();
        localStorage.setItem(key, next);
        return next;
      }

      function ansiToHtml(value) {
        return ansiUp.ansi_to_html(String(value || "")) || "无输出。";
      }

      function appendMessage(role, value) {
        const message = document.createElement("article");
        message.className = `message ${role}`;

        const label = document.createElement("div");
        label.className = "message-role";
        label.textContent = role === "user" ? "你" : role === "system" ? "系统" : "WalnutAI";

        const body = document.createElement("div");
        body.className = "message-body";
        body.innerHTML = ansiToHtml(value);

        message.append(label, body);
        resultEl.append(message);
        resultEl.scrollTop = resultEl.scrollHeight;
        return message;
      }

      function removeMessage(message) {
        if (message?.parentNode === resultEl) message.remove();
      }

      function showRecoveryCard(turn) {
        const recovery = turn.recovery;
        if (!recovery || recovery.status === "not-needed") return;

        const card = document.createElement("div");
        card.className = `recovery-card${recovery.status === "pending" ? " pending" : ""}`;

        const label = document.createElement("div");
        label.className = "recovery-label";
        label.textContent = recovery.status === "pending" ? "⏳ 等待确认 — 需要你批准才能继续" : "⚠️ 需要恢复操作";
        card.append(label);

        if (recovery.error) {
          const errEl = document.createElement("div");
          errEl.className = "recovery-error";
          errEl.textContent = recovery.error;
          card.append(errEl);
        }

        if (recovery.failedStepId) {
          const stepEl = document.createElement("div");
          stepEl.className = "recovery-error";
          stepEl.textContent = `失败步骤：${recovery.failedStepId}`;
          card.append(stepEl);
        }

        const actions = document.createElement("div");
        actions.className = "recovery-actions";

        if (recovery.status === "pending" && recovery.pendingNext) {
          const pendingText = pendingNextLabel(recovery.pendingNext);

          const info = document.createElement("div");
          info.className = "recovery-error";
          info.textContent = `待确认：${pendingText}`;
          card.append(info);

          const confirmBtn = document.createElement("button");
          confirmBtn.className = "recovery-btn confirm";
          confirmBtn.textContent = "✓ 确认执行";
          confirmBtn.addEventListener("click", () => reSend("我确认继续：请执行刚才等待确认的动作。"));
          actions.append(confirmBtn);

          const skipBtn = document.createElement("button");
          skipBtn.className = "recovery-btn warn";
          skipBtn.textContent = "跳过，不做";
          skipBtn.addEventListener("click", () => reSend("跳过刚才等待确认的动作，做其他事情。"));
          actions.append(skipBtn);
        }

        if (recovery.options && recovery.options.length) {
          for (const option of recovery.options) {
            const btn = document.createElement("button");
            btn.className = "recovery-btn";
            btn.textContent = option;
            btn.addEventListener("click", () => reSend(option));
            actions.append(btn);
          }
        }

        if (recovery.status === "available") {
          const retryBtn = document.createElement("button");
          retryBtn.className = "recovery-btn retry";
          retryBtn.textContent = "↻ 重试";
          retryBtn.addEventListener("click", () => reSend(promptEl.value || "重试刚才的操作"));
          actions.append(retryBtn);
        }

        card.append(actions);
        resultEl.append(card);
        resultEl.scrollTop = resultEl.scrollHeight;
      }

      function reSend(text) {
        promptEl.value = text;
        sendPrompt("intent");
      }

      function pendingNextLabel(pendingNext) {
        const tasks = Array.isArray(pendingNext.tasks) && pendingNext.tasks.length
          ? pendingNext.tasks
          : pendingNext.blockedBy ? [pendingNext.blockedBy] : [pendingNext];
        const label = tasks.map((t) => `${t.kind}${t.action ? `:${t.action}` : ""}`).join(", ");
        return pendingNext.reason ? `${label} (${pendingNext.reason})` : label;
      }

      function pendingNextKind(turn) {
        return turn.pendingNext?.kind || null;
      }

      function updateRoute(classification) {
        intentEl.textContent = classification?.route ? `${classification.route}:${classification.action || "-"}` : classification?.intent || "-";
        deliveryEl.textContent = classification?.delivery || "-";
        confidenceEl.textContent = classification?.confidence ?? "-";
      }

      function updateScreenPreview(output, screenId) {
        const imagePath = output?.path;
        if (!imagePath) return;
        const relativePath = imagePath.replace(/^\.\.\//, "");
        screenPreviewImageEl.src = `/api/screen/workspace/assets/${encodeURIComponent(relativePath)}?v=${Date.now()}`;
        screenPreviewImageEl.alt = `${screenId || "Screen"} preview`;
        screenPreviewImageEl.hidden = false;
        screenPreviewTextEl.hidden = true;
        screenPreviewEl.classList.add("has-image");
      }

      function stopPreviewPlayer() {
        window.clearTimeout(previewTimer);
        previewTimer = 0;
        previewFrames = [];
        previewFrameIndex = 0;
        previewPaused = false;
        screenPreviewToggleEl.hidden = true;
        screenPreviewToggleEl.textContent = "暂停";
      }

      function showPreviewFrame(index) {
        if (!previewFrames.length) return;
        previewFrameIndex = (index + previewFrames.length) % previewFrames.length;
        const frame = previewFrames[previewFrameIndex];
        screenPreviewImageEl.src = `${frame.png}?v=${encodeURIComponent(frame.playlistHash || Date.now())}`;
        screenPreviewImageEl.hidden = false;
        screenPreviewTextEl.hidden = true;
        screenPreviewEl.classList.add("has-image");
      }

      function schedulePreviewFrame() {
        window.clearTimeout(previewTimer);
        if (previewPaused || previewFrames.length <= 1) return;
        previewTimer = window.setTimeout(() => {
          showPreviewFrame(previewFrameIndex + 1);
          schedulePreviewFrame();
        }, Math.max(80, previewFrames[previewFrameIndex]?.durationMs || 160));
      }

      function startPreviewPlayer(frames, playlistHash) {
        stopPreviewPlayer();
        previewFrames = frames.map((frame) => ({ ...frame, playlistHash }));
        screenPreviewToggleEl.hidden = previewFrames.length <= 1;
        showPreviewFrame(0);
        schedulePreviewFrame();
      }

      async function updateLvglScreenPreview(output, screenId) {
        try {
          const response = await fetch("/api/screen/workspace/lvgl-preview", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({}),
          });
          const data = await response.json();
          if (!response.ok || !data.ok || !data.frames?.[0]?.png) throw new Error(data.output || data.error || "lvgl preview failed");
          screenPreviewImageEl.alt = `${screenId || "Screen"} LVGL preview`;
          startPreviewPlayer(data.frames, data.playlistHash);
        } catch (error) {
          stopPreviewPlayer();
          appendMessage("assistant", error.message);
        }
      }

      async function updateCurrentLvglPreview(mode = "playlist") {
        try {
          const endpoint = mode === "widget"
            ? "/api/screen/widget-apps/current/preview"
            : "/api/screen/workspace/lvgl-preview";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({}),
          });
          const data = await response.json();
          if (!response.ok || !data.ok || !data.frames?.[0]?.png) throw new Error(data.output || data.error || "lvgl preview failed");
          screenPreviewImageEl.alt = "Current LVGL screen preview";
          startPreviewPlayer(data.frames, data.playlistHash || `${mode}-${Date.now()}`);
        } catch (error) {
          appendMessage("assistant", error.message);
        }
      }

      async function activateScreenApp(appId) {
        const selected = [...screenAppSelectEl.options].find((option) => option.value === appId);
        const appType = selected?.dataset.type || "official-demo";
        screenAppSelectEl.disabled = true;
        try {
          const response = await fetch("/api/screen/lvgl-app/activate", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ appId }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.output || data.error || "app activate failed");
          await updateCurrentLvglPreview("playlist");
        } catch (error) {
          appendMessage("assistant", error.message);
        } finally {
          screenAppSelectEl.disabled = false;
        }
      }

      async function loadScreenApps() {
        try {
          const response = await fetch("/api/screen/lvgl-apps", { cache: "no-store" });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "app list failed");
          screenAppSelectEl.textContent = "";
          for (const app of data.apps || []) {
            if (app.type !== "official-demo" && app.type !== "local-lvgl-app") continue;
            const option = document.createElement("option");
            option.value = app.id;
            option.dataset.type = app.type;
            option.textContent = app.title;
            screenAppSelectEl.append(option);
          }
        } catch (error) {
          const option = document.createElement("option");
          option.textContent = error.message;
          screenAppSelectEl.append(option);
          screenAppSelectEl.disabled = true;
        }
      }

      function asksForLocalAssistantInfo(text) {
        const value = String(text || "").trim().toLowerCase();
        if (!value) return false;
        const asksCapability = /你\s*(?:现在|目前|到底)?\s*(?:是?谁|能做什么|能帮我做(?:什么|哪些事)|可以做什么|会做什么|有什么功能|介绍(?:一下)?(?:你自己|自己)?|职责)|walnut\s*ai|walnutai/.test(value);
        const forbidsDevice = /不要\s*(?:连接|碰|访问|检查|操作).{0,8}(?:设备|核桃派)|别\s*(?:连接|碰|访问|检查|操作).{0,8}(?:设备|核桃派)|不(?:要|用)\s*(?:ssh|远端|真机|设备)|只\s*(?:说明|介绍|回答)|local\s*only|no\s*(?:ssh|device|remote)/i.test(value);
        return asksCapability && forbidsDevice;
      }

      function localAssistantInfoReply() {
        return [
          "我是 Walnut Agent Console 的 Web 入口，可以帮你把自然语言请求路由到受控能力。",
          "当前可以处理：只读设备状态、网络、快照、GPIO 检查；Screen Workspace 小屏内容与预览；笔记；以及需要时委托设备侧 WalnutAI。",
          "这次你要求不要连接设备，所以我没有执行 SSH、真机检查或设备侧 WalnutAI。"
        ].join("\n");
      }

      async function runTurn(mode, text) {
        const response = await fetch("/api/agent/turn", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ mode, text, sessionId }),
        });
        const data = await response.json();
        if (!response.ok || data.status === "failed") throw new Error(platformTurnText(data) || data.error || "turn failed");
        return data;
      }

      function watchTurn(turn, onDone) {
        if (agentEvents) agentEvents.close();
        let lastSeq = 0;
        agentEvents = new EventSource(`/api/agent/events?sessionId=${encodeURIComponent(sessionId)}&afterSeq=${lastSeq}`);
        const onEvent = async (event) => {
          const data = JSON.parse(event.data);
          if (data.turnId !== turn.turnId) return;
          lastSeq = data.seq || lastSeq;
          if (data.kind === "agent.started") appendMessage("system", `${data.stepId || "agent"}: ${data.status}`);
          if (data.kind === "agent.completed" || data.kind === "agent.failed" || data.kind === "agent.pending") appendMessage("system", `${data.stepId || "agent"}: ${data.status}`);
          if (data.kind === "turn.completed" || data.kind === "turn.failed") {
            agentEvents.close();
            agentEvents = null;
            await onDone(data);
          }
        };
        for (const name of ["turn.completed", "turn.failed", "turn.pending", "agent.started", "agent.completed", "agent.failed", "agent.pending"]) {
          agentEvents.addEventListener(name, onEvent);
        }
      }

      async function showGeneratedScreen(data, classification) {
        await updateLvglScreenPreview(data.output, data.screenId);
        const syncHint = classification.delivery === "sync_after_preview"
          ? "你要求生成后同步：我已先生成并更新预览，请在 Screen Workspace 确认画面后点击“同步到核桃派”。"
          : "你要求先预览：我没有连接设备，也没有同步。";
        return [
          `已生成 Widget App 小屏：${data.screenId}`,
          syncHint,
          "右侧 LVGL 预览已更新；打开 Screen Workspace 可查看和同步。",
        ].join("\n");
      }

      function latestToolResult(turn) {
        return Array.isArray(turn?.toolResults) ? turn.toolResults.at(-1) : null;
      }

      function platformTurnText(turn) {
        const latest = latestToolResult(turn);
        const payload = latest?.result?.payload || latest?.result?.sync || latest?.result || {};
        return turn?.userSummary
          || latest?.summary
          || payload.output
          || payload.reply
          || payload.summary
          || "";
      }

      function setBusy(busy) {
        promptEl.disabled = busy;
        submitIntentEl.disabled = busy;
        askAiEl.disabled = busy;
      }

      async function sendPrompt(mode) {
        const text = promptEl.value.trim();
        if (!text) return;
        setBusy(true);
        appendMessage("user", text);
        const pendingMessage = appendMessage("system", mode === "ai" ? "正在询问 WalnutAI..." : "处理中...");
        try {
          if (asksForLocalAssistantInfo(text)) {
            removeMessage(pendingMessage);
            appendMessage("assistant", localAssistantInfoReply());
          } else {
            const turn = await runTurn(mode, text);
            const classification = turn.route;
            if (mode !== "ai") updateRoute(classification);
            removeMessage(pendingMessage);
            appendMessage("assistant", platformTurnText(turn) || "无输出。");
            if (turn.recovery && turn.recovery.status !== "not-needed") showRecoveryCard(turn);
          }
          promptEl.value = "";
        } catch (error) {
          removeMessage(pendingMessage);
          appendMessage("assistant", error.message);
        } finally {
          setBusy(false);
          promptEl.focus();
        }
      }

      document.getElementById("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        await sendPrompt("intent");
      });

      askAiEl.addEventListener("click", async () => {
        await sendPrompt("ai");
      });

      screenPreviewToggleEl.addEventListener("click", (event) => {
        event.preventDefault();
        previewPaused = !previewPaused;
        screenPreviewToggleEl.textContent = previewPaused ? "播放" : "暂停";
        if (previewPaused) window.clearTimeout(previewTimer);
        else schedulePreviewFrame();
      });

      screenAppSelectEl.addEventListener("change", () => activateScreenApp(screenAppSelectEl.value));

      loadScreenApps();
      updateCurrentLvglPreview();

    </script>
  </body>
</html>
