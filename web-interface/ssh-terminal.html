<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>root@192.168.1.30</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0c0d0e;
        color: #f0efe7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c0d0e;
      }

      body {
        display: grid;
        grid-template-rows: 48px minmax(0, 1fr);
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #2d3230;
        padding: 0 12px 0 16px;
        background: #151716;
      }

      .target {
        min-width: 0;
      }

      .title {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 2px;
        color: #aab2a8;
        font-size: 11px;
        letter-spacing: 0;
      }

      .dot {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #d0a044;
      }

      .dot.is-open {
        background: #75c486;
      }

      .dot.is-closed {
        background: #d66b65;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button {
        height: 32px;
        border: 1px solid #3a403c;
        border-radius: 6px;
        padding: 0 11px;
        background: #212522;
        color: #f0efe7;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        border-color: #b28d49;
        outline: none;
      }

      #terminal {
        min-width: 0;
        min-height: 0;
        padding: 10px;
        background: #0c0d0e;
      }

      .xterm {
        height: 100%;
      }

      @media (max-width: 560px) {
        body {
          grid-template-rows: 54px minmax(0, 1fr);
        }

        .bar {
          padding: 0 8px 0 10px;
        }

        .title {
          max-width: calc(100vw - 118px);
          font-size: 12px;
        }

        button {
          width: 36px;
          padding: 0;
          overflow: hidden;
          text-indent: 40px;
          white-space: nowrap;
          position: relative;
        }

        button::before {
          content: "R";
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          text-indent: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="target">
        <p class="title">root@192.168.1.30</p>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="statusText">Connecting</span>
        </div>
      </div>
      <div class="actions">
        <button id="reconnect" type="button">Reconnect</button>
      </div>
    </header>
    <main id="terminal"></main>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script>
      const terminalElement = document.querySelector("#terminal");
      const statusText = document.querySelector("#statusText");
      const dot = document.querySelector("#dot");
      const reconnectButton = document.querySelector("#reconnect");

      const term = new Terminal({
        cursorBlink: true,
        fontFamily: 'Menlo, Monaco, Consolas, "Liberation Mono", monospace',
        fontSize: 13,
        lineHeight: 1.15,
        scrollback: 5000,
        theme: {
          background: "#0c0d0e",
          foreground: "#f0efe7",
          cursor: "#d0a044",
          selectionBackground: "#4b5b51",
          black: "#0c0d0e",
          red: "#d66b65",
          green: "#75c486",
          yellow: "#d0a044",
          blue: "#7aa8d8",
          magenta: "#c88bd6",
          cyan: "#78c8c1",
          white: "#f0efe7",
          brightBlack: "#5e6962",
          brightRed: "#ee8179",
          brightGreen: "#92dc9f",
          brightYellow: "#e0b65a",
          brightBlue: "#98bfeb",
          brightMagenta: "#dba0e6",
          brightCyan: "#94ded6",
          brightWhite: "#ffffff",
        },
      });

      const fitAddon = new FitAddon.FitAddon();
      let socket;

      term.loadAddon(fitAddon);
      term.open(terminalElement);
      fitAddon.fit();

      function setStatus(text, state) {
        statusText.textContent = text;
        dot.classList.toggle("is-open", state === "open");
        dot.classList.toggle("is-closed", state === "closed");
      }

      function connect() {
        if (socket) {
          socket.close();
        }

        setStatus("Connecting", "pending");
        term.reset();

        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        socket = new WebSocket(`${protocol}://${window.location.host}/terminal`);
        socket.binaryType = "arraybuffer";

        socket.addEventListener("open", () => {
          setStatus("Connected", "open");
          term.focus();
        });

        socket.addEventListener("message", (event) => {
          if (event.data instanceof ArrayBuffer) {
            term.write(new Uint8Array(event.data));
            return;
          }

          term.write(event.data);
        });

        socket.addEventListener("close", () => {
          setStatus("Closed", "closed");
        });

        socket.addEventListener("error", () => {
          setStatus("Error", "closed");
        });
      }

      term.onData((data) => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(data);
        }
      });

      reconnectButton.addEventListener("click", connect);
      window.addEventListener("resize", () => fitAddon.fit());
      connect();
    </script>
  </body>
</html>
