<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLB Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #101214;
        color: #f4f1e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.08), transparent 32%),
          linear-gradient(140deg, #101214 0%, #1a1d1e 48%, #111515 100%);
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }

      .label,
      .actions {
        border: 1px solid rgba(244, 241, 232, 0.18);
        border-radius: 8px;
        background: rgba(16, 18, 20, 0.72);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(14px);
      }

      .label {
        min-width: 0;
        padding: 10px 12px;
      }

      .title {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .status {
        min-height: 17px;
        margin-top: 4px;
        color: #bfc6be;
        font-size: 12px;
        letter-spacing: 0;
      }

      .actions {
        display: flex;
        flex: 0 0 auto;
        gap: 6px;
        padding: 6px;
        pointer-events: auto;
      }

      button {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #f4f1e8;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: rgba(244, 241, 232, 0.12);
        outline: none;
      }

      button.is-active {
        background: #d8a34b;
        color: #17140f;
      }

      svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
        fill: none;
      }

      @media (max-width: 620px) {
        .hud {
          top: 10px;
          left: 10px;
          right: 10px;
          align-items: flex-start;
        }

        .label {
          padding: 9px 10px;
        }

        .title {
          max-width: calc(100vw - 122px);
          font-size: 12px;
        }

        .status {
          font-size: 11px;
        }

        .actions {
          gap: 4px;
          padding: 4px;
        }

        button {
          width: 34px;
          height: 34px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="viewer"></canvas>
    <div class="hud" aria-live="polite">
      <div class="label">
        <p class="title">0c6390ea8b1ccf186ec099456954fd42.glb</p>
        <div class="status" id="status">Loading 0%</div>
      </div>
      <div class="actions">
        <button id="resetView" type="button" aria-label="Reset view" title="Reset view">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 3v6h6" />
          </svg>
        </button>
        <button
          id="toggleRotate"
          class="is-active"
          type="button"
          aria-label="Toggle rotation"
          title="Toggle rotation"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 0 1-15.7 6" />
            <path d="M3 12a9 9 0 0 1 15.7-6" />
            <path d="M21 4v6h-6" />
            <path d="M3 20v-6h6" />
          </svg>
        </button>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const MODEL_URL = "./0c6390ea8b1ccf186ec099456954fd42.glb";

      const canvas = document.querySelector("#viewer");
      const status = document.querySelector("#status");
      const resetViewButton = document.querySelector("#resetView");
      const toggleRotateButton = document.querySelector("#toggleRotate");

      const scene = new THREE.Scene();
      scene.background = null;

      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
      camera.position.set(3, 2, 5);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.9;
      controls.target.set(0, 0.5, 0);

      scene.add(new THREE.HemisphereLight(0xf6f1df, 0x4d5f68, 2.2));

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
      keyLight.position.set(4, 6, 5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xcfe6ff, 1.2);
      fillLight.position.set(-5, 2, -3);
      scene.add(fillLight);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(4, 96),
        new THREE.MeshStandardMaterial({
          color: 0x242826,
          roughness: 0.86,
          metalness: 0.05,
        }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.02;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(8, 24, 0x6f786f, 0x343b36);
      grid.material.opacity = 0.34;
      grid.material.transparent = true;
      scene.add(grid);

      let modelRoot;
      let homePosition = camera.position.clone();
      let homeTarget = controls.target.clone();

      function resizeRenderer() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const needsResize = canvas.width !== width || canvas.height !== height;

        if (needsResize) {
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
      }

      function frameModel(root) {
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);
        const safeSize = maxSize || 1;

        root.position.sub(center);
        floor.scale.setScalar(Math.max(safeSize * 0.72, 1));

        const distance = safeSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)));
        const direction = new THREE.Vector3(0.72, 0.42, 1).normalize();
        homePosition = direction.multiplyScalar(distance * 1.65);
        homeTarget = new THREE.Vector3(0, Math.min(size.y * 0.08, safeSize * 0.15), 0);

        camera.near = Math.max(safeSize / 1000, 0.01);
        camera.far = safeSize * 100;
        camera.position.copy(homePosition);
        controls.target.copy(homeTarget);
        controls.maxDistance = safeSize * 8;
        controls.minDistance = safeSize * 0.08;
        controls.update();
        camera.updateProjectionMatrix();
      }

      resetViewButton.addEventListener("click", () => {
        camera.position.copy(homePosition);
        controls.target.copy(homeTarget);
        controls.update();
      });

      toggleRotateButton.addEventListener("click", () => {
        controls.autoRotate = !controls.autoRotate;
        toggleRotateButton.classList.toggle("is-active", controls.autoRotate);
      });

      new GLTFLoader().load(
        MODEL_URL,
        (gltf) => {
          modelRoot = gltf.scene;
          scene.add(modelRoot);
          frameModel(modelRoot);
          status.textContent = "Ready";
        },
        (event) => {
          if (!event.total) {
            status.textContent = "Loading";
            return;
          }

          const progress = Math.min(100, Math.round((event.loaded / event.total) * 100));
          status.textContent = `Loading ${progress}%`;
        },
        (error) => {
          console.error(error);
          status.textContent = "Could not load model";
        },
      );

      function animate() {
        resizeRenderer();
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
