services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: walnutpi-postgres
    environment:
      POSTGRES_DB: walnutpi
      POSTGRES_USER: walnutpi
      POSTGRES_PASSWORD: walnutpi_dev
    ports:
      - "${WALNUT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - walnutpi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walnutpi -d walnutpi"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: walnutpi-langfuse-worker
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${WALNUT_LANGFUSE_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://langfuse:langfuse_dev@langfuse-postgres:5432/langfuse
      SALT: walnutpi-langfuse-local-salt
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse_dev
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_USE_AZURE_BLOB: "false"
      LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio_dev_secret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minio_dev_secret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: minio
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: minio_dev_secret
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: redis_dev_secret
      LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: "false"
      REDIS_TLS_ENABLED: "false"
      EMAIL_FROM_ADDRESS: ""
      SMTP_CONNECTION_URL: ""

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    container_name: walnutpi-langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "${WALNUT_LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: walnutpi-langfuse-local-nextauth-secret
      LANGFUSE_INIT_ORG_ID: ${WALNUT_LANGFUSE_INIT_ORG_ID:-walnutpi-local-org}
      LANGFUSE_INIT_ORG_NAME: ${WALNUT_LANGFUSE_INIT_ORG_NAME:-WalnutPi Local}
      LANGFUSE_INIT_PROJECT_ID: ${WALNUT_LANGFUSE_INIT_PROJECT_ID:-walnutpi-local-project}
      LANGFUSE_INIT_PROJECT_NAME: ${WALNUT_LANGFUSE_INIT_PROJECT_NAME:-WalnutPi Local}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${WALNUT_LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-walnutpi-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${WALNUT_LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-walnutpi-local}
      LANGFUSE_INIT_USER_EMAIL: ${WALNUT_LANGFUSE_INIT_USER_EMAIL:-owner@walnutpi.local}
      LANGFUSE_INIT_USER_NAME: ${WALNUT_LANGFUSE_INIT_USER_NAME:-WalnutPi Owner}
      LANGFUSE_INIT_USER_PASSWORD: ${WALNUT_LANGFUSE_INIT_USER_PASSWORD:-walnutpi-local-password}

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    container_name: walnutpi-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse_dev
    volumes:
      - walnutpi-langfuse-clickhouse-data:/var/lib/clickhouse
      - walnutpi-langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: walnutpi-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_secret
    ports:
      - "${WALNUT_LANGFUSE_MINIO_PORT:-9090}:9000"
      - "127.0.0.1:${WALNUT_LANGFUSE_MINIO_CONSOLE_PORT:-9091}:9001"
    volumes:
      - walnutpi-langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5

  langfuse-redis:
    image: docker.io/redis:7
    container_name: walnutpi-langfuse-redis
    restart: unless-stopped
    command: >
      --requirepass redis_dev_secret
      --maxmemory-policy noeviction
    volumes:
      - walnutpi-langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_secret", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    image: docker.io/postgres:17
    container_name: walnutpi-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev
      TZ: UTC
      PGTZ: UTC
    volumes:
      - walnutpi-langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  walnutpi-postgres-data:
  walnutpi-langfuse-postgres-data:
  walnutpi-langfuse-clickhouse-data:
  walnutpi-langfuse-clickhouse-logs:
  walnutpi-langfuse-minio-data:
  walnutpi-langfuse-redis-data:
